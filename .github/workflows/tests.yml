# Runs the Tasks & Notes test suite on every push and pull request.
# The data science notebooks are not run here: their data is not in the repository.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    name: Tasks & Notes (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tasks_and_Notes
    env:
      DJANGO_DEBUG: 'true'   # local settings: SQLite, no secret key needed
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: Tasks_and_Notes/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # requirements.txt is used for deployment (Elastic Beanstalk) and must match uv.lock.
      - name: Check that requirements.txt is up to date
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project --quiet --output-file requirements.txt
          git diff --exit-code requirements.txt

      - name: Check that migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run python manage.py test
