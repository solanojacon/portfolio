{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <div class="row">
    <div class="col-lg-7">
      <h1 class="h3 mb-3">{{ title }}</h1>
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
